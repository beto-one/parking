name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev build-essential

      - name: Install Buildozer
        run: pip install buildozer==1.5.0 cython==0.29.36 virtualenv setuptools

      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          grep -n -i -E "traceback|error:|fatal|failed" build.log | tail -40 || true
          echo "----- LAST LINES -----"
          tail -60 build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: parking-apk
          path: bin/*.apk
          if-no-files-found: error