name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev libltdl-dev \
          libgl1-mesa-dev

    - name: Install Python Dependencies
      run: |
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Patch buildozer.spec for CI
      run: |
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.build_tools_version = 33.0.2" >> buildozer.spec
        echo "android.archs = arm64-v8a" >> buildozer.spec

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export BUILDOZER_WARN_ON_ROOT=0
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: parking-apk
        path: ./bin/*.apk
        if-no-files-found: error